gui:
  theme:
    activeBorderColor:
      - '#7aa2f7'
      - bold
    inactiveBorderColor:
      - '#414868'
    selectedLineBgColor:
      - '#283457'
    optionsTextColor:
      - '#7aa2f7'
  scrollHeight: 4
  showFileTree: true
  showRandomTip: false
  nerdFontsVersion: '3'

git:
  paging:
    colorArg: always
    pager: delta --paging=never
  autoFetch: true
  autoStageResolvedConflicts: true

os:
  editPreset: 'vim'
  edit: 'lvim {{filename}}'
